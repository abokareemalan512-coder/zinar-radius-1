{% extends 'base.html' %}
{% block title %}إضافة مشترك جديد{% endblock %}

{% block content %}
<div class="container-fluid" style="max-width: 800px;">
    <div class="card card-custom p-4">
        <div class="d-flex align-items-center gap-3 mb-4">
            <div class="bg-primary bg-opacity-10 p-3 rounded-3 text-info">
                <i class="fa-solid fa-user-plus fs-3"></i>
            </div>
            <div>
                <h3 class="fw-bold mb-1">إضافة مشترك جديد</h3>
                <p class="text-muted m-0">الحساب سيعمل تلقائياً على كافة السيرفرات والراوترات المضافة (PPPoE & Hotspot)</p>
            </div>
        </div>

        <form action="/add_subscriber" method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label text-light fw-semibold"><i class="fa-solid fa-user me-1 text-info"></i> اسم المستخدم (Username)</label>
                    <input type="text" name="username" class="form-control" placeholder="أدخل اسم المستخدم" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-light fw-semibold"><i class="fa-solid fa-key me-1 text-info"></i> كلمة المرور (Password)</label>
                    <input type="text" name="password" class="form-control" placeholder="أدخل كلمة المرور" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-light fw-semibold"><i class="fa-solid fa-box me-1 text-info"></i> الباقة / البروفايل</label>
                    <input type="text" name="profile" class="form-control" placeholder="مثال: 5M_Default" value="Default">
                </div>

                <div class="col-md-6">
                    <label class="form-label text-light fw-semibold"><i class="fa-solid fa-phone me-1 text-info"></i> رقم الهاتف (اختياري)</label>
                    <input type="text" name="phone" class="form-control" placeholder="09xxxxxxxx">
                </div>

                <div class="col-md-12">
                    <label class="form-label text-light fw-semibold"><i class="fa-solid fa-calendar me-1 text-info"></i> تاريخ الانتهاء</label>
                    <input type="date" name="expiry_date" class="form-control">
                </div>
            </div>

            <hr class="border-secondary my-4">

            <div class="d-flex justify-content-end gap-2">
                <a href="/subscribers" class="btn btn-outline-secondary px-4">إلغاء</a>
                <button type="submit" class="btn btn-info text-dark fw-bold px-4"><i class="fa-solid fa-check ms-1"></i> حفظ وتفعيل الحساب</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
