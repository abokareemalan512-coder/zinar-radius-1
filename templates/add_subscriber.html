{% extends "base.html" %}
{% block title %}إضافة مشترك{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>➕ إضافة مشترك جديد</h2>
    <a href="{{ url_for('subscribers') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-right"></i> رجوع
    </a>
</div>

<div class="row g-4">
    <div class="col-lg-8">
        <div class="card p-4">
            <form method="POST" action="{{ url_for('add_subscriber') }}">

                <div class="mb-3">
                    <label class="form-label">
                        <i class="bi bi-person-badge text-accent"></i> اسم المشترك
                    </label>
                    <input type="text" name="name" class="form-control"
                           placeholder="مثال: أحمد محمد">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="bi bi-person text-accent"></i> اسم المستخدم
                        </label>
                        <input type="text" name="username" class="form-control"
                               placeholder="ahmed123" required autofocus>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            <i class="bi bi-key text-accent"></i> كلمة المرور
                        </label>
                        <input type="text" name="password" class="form-control"
                               placeholder="••••••" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        <i class="bi bi-box-seam text-accent"></i> الباقة
                    </label>
                    <select name="package" class="form-select">
                        <option value="">— اختر باقة —</option>
                        {% for pkg in packages %}
                        <option value="{{ pkg.name }}">
                            {{ pkg.name }} — {{ pkg.duration }} يوم — {{ pkg.price }} ل.س
                        </option>
                        {% else %}
                        <option value="" disabled>لا توجد باقات</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">
                        <i class="bi bi-router text-accent"></i> الراوتر
                    </label>
                    <select name="router_id" class="form-select">
                        <option value="">— بدون راوتر —</option>
                        {% for r in routers %}
                        <option value="{{ r.id }}">{{ r.name }} — {{ r.ip_address }}</option>
                        {% else %}
                        <option value="" disabled>لا توجد راوترات</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1 py-2 fw-bold">
                        <i class="bi bi-save"></i> حفظ المشترك
                    </button>
                    <a href="{{ url_for('subscribers') }}" class="btn btn-secondary">إلغاء</a>
                </div>
            </form>
        </div>
    </div>

    <div class="col-lg-4">
        <div class="alert alert-info">
            💡 <strong>ملاحظة:</strong>
            <ul class="mb-0 mt-2" style="line-height: 1.8;">
                <li>تاريخ الانتهاء يُحسب تلقائيًا من مدة الباقة</li>
                <li>مثال: باقة 30 يوم → ينتهي بعد 30 يوم من اليوم</li>
                <li>يمكنك تصفير أو تمديد الاشتراك لاحقًا</li>
            </ul>
        </div>
    </div>
</div>
{% endblock %}
