{% extends "base.html" %}
{% block title %}إضافة مشترك{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="fa-solid fa-user-plus text-primary"></i> إضافة مشترك جديد</h1>
</div>

{% if not has_master %}
<div class="alert alert-warning">
    لازم تحدد راوتر كـ "سيرفر رئيسي" أولاً.
    <a href="{{ url_for('routers') }}" class="alert-link">روح لصفحة الراوترات</a>
</div>
{% endif %}

<div class="row">
    <div class="col-md-6">
        <div class="card shadow-sm p-4">
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">اسم المستخدم (Username)</label>
                    <input type="text" name="username" class="form-control" required {{ 'disabled' if not has_master }}>
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور (Password)</label>
                    <input type="text" name="password" class="form-control" required {{ 'disabled' if not has_master }}>
                </div>
                <div class="mb-3">
                    <label class="form-label">الباقة (Profile)</label>
                    {% if profiles %}
                    <select name="profile" class="form-control" {{ 'disabled' if not has_master }}>
                        <option value="">بدون باقة</option>
                        {% for p in profiles %}
                        <option value="{{ p.name }}">{{ p.name }}</option>
                        {% endfor %}
                    </select>
                    {% else %}
                    <input type="text" name="profile" class="form-control" placeholder="مثال: 5M" {{ 'disabled' if not has_master }}>
                    {% endif %}
                </div>
                <button type="submit" class="btn btn-primary w-100" {{ 'disabled' if not has_master }}>
                    حفظ وتفعيل المشترك على الراوتر مباشرة
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
