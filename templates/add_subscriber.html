<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إضافة مشترك - زينار نت</title>
<style>
*{box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:system-ui,Tahoma;margin:0;padding:20px}
.card{background:linear-gradient(180deg,#1e293b,#162032);border:1px solid #2a3a54;border-radius:16px;padding:24px;max-width:480px;margin:auto;box-shadow:0 10px 30px #0005}
h2{margin:0 0 16px;text-align:center}
.sham{display:flex;align-items:center;justify-content:space-between;background:#0b1220;border:1px solid #1e3a5f;border-radius:12px;padding:12px 16px;margin-bottom:18px;cursor:pointer}
.sham:hover{border-color:#22c55e}
.sham span{color:#94a3b8;font-size:13px}
.sham b{color:#22c55e;font-size:20px;letter-spacing:1px}
.sham i{font-style:normal;background:#22c55e;color:#052e13;padding:4px 10px;border-radius:20px;font-size:12px}
input,select{width:100%;padding:13px 14px;margin:7px 0;border-radius:10px;border:1px solid #2a3a54;background:#0f172a;color:white;outline:none}
input:focus,select:focus{border-color:#0ea5e9}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#0ea5e9,#22d3ee);color:#00111a;border:none;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px}
.link{display:block;text-align:center;margin-top:14px;color:#64748b;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="card">
<h2>✨ إضافة مشترك</h2>

<div class="sham" onclick="copySham()" id="box">
<div>
<span>💳 حساب شام كاش</span><br>
<b id="num">{{ sham_account }}</b>
</div>
<i id="txt">نسخ</i>
</div>

<form method="POST">
<input name="full_name" placeholder="الاسم الكامل" required>
<input name="username" placeholder="اسم المستخدم *" required>
<input name="password" placeholder="كلمة المرور *" required>
<input name="phone" placeholder="واتساب 9639xxxxxxxx" required>
<select name="profile" required>
<option value="">— اختر الباقة —</option>
{% for p in packages %}<option value="{{ p['name'] }}">{{ p['name'] }} - {{ p['price'] }}$</option>{% endfor %}
</select>
<select name="service_type"><option value="hotspot">هوتسبوت Hotspot</option><option value="pppoe">PPPoE</option></select>
<button class="btn">حفظ وإضافة للمايكروتك ✅</button>
</form>
<a class="link" href="/subscribers">← رجوع للمشتركين</a>
</div>
<script>
function copySham(){
  let n=document.getElementById('num').innerText;
  navigator.clipboard.writeText(n);
  let t=document.getElementById('txt');
  t.innerText='✅ تم';
  setTimeout(()=>t.innerText='نسخ',1500);
}
</script>
</body>
</html>
