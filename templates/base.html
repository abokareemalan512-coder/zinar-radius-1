<!DOCTYPE html>
<html lang="ar" dir="rtl" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ZINAR{% endblock %} | ZINAR</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root{
            --bg-main:#0f172a;
            --bg-card:#1e293b;
            --bg-hover:#334155;
            --text-main:#f1f5f9;
            --text-muted:#94a3b8;
            --accent:#38bdf8;
            --accent-hover:#7dd3fc;
            --accent-glow:rgba(56,189,248,0.35);
        }
        *{box-sizing:border-box}
        body{
            background-color:var(--bg-main) !important;
            color:var(--text-main);
            margin:0;
            font-family:'Segoe UI', Tahoma, sans-serif;
        }
        .layout{display:flex;min-height:100vh}
        .sidebar{
            width:240px;
            background-color:var(--bg-card);
            border-left:1px solid var(--bg-hover);
            padding:20px 12px;
            flex-shrink:0;
        }
        .brand{
            text-align:center;
            padding:20px 0 24px;
            border-bottom:1px solid var(--bg-hover);
            margin-bottom:20px;
        }
        .brand-icon{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            width:46px;
            height:46px;
            background:linear-gradient(135deg,var(--accent),#0ea5e9);
            border-radius:12px;
            font-size:24px;
            box-shadow:0 4px 12px var(--accent-glow);
        }
        .main{flex:1;padding:24px;overflow-x:auto}
        .card{
            background-color:var(--bg-card) !important;
            border:1px solid var(--bg-hover) !important;
            color:var(--text-main) !important;
            border-radius:12px;
        }
        .nav-item.active{
            background-color:var(--bg-hover);
            color:var(--accent);
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">⚡</div>
                <div>
                    <h4>ZINAR</h4>
                </div>
            </div>

            <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
                لوحة التحكم
            </a>
            <a href="{{ url_for('subscribers') }}" class="nav-item {% if request.endpoint in ['subscribers','add_subscriber'] %}active{% endif %}">
                المشتركين
            </a>
            <a href="{{ url_for('packages') }}" class="nav-item {% if request.endpoint == 'packages' %}active{% endif %}">
                الباقات
            </a>
            <a href="{{ url_for('payments') }}" class="nav-item {% if request.endpoint == 'payments' %}active{% endif %}">
                الدفعات
            </a>
            <a href="{{ url_for('admin_settings') }}" class="nav-item {% if request.endpoint == 'admin_settings' %}active{% endif %}">
                إعدادات النظام
            </a>
            <a href="{{ url_for('logout') }}" class="nav-item">
                خروج
            </a>
        </aside>

        <main class="main">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endwith %}
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
