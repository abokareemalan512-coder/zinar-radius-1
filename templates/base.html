<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - زينار RADIUS</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar {
            width: 260px;
            background-color: #1e293b;
            min-height: 100vh;
            border-left: 1px solid #334155;
        }
        .sidebar .nav-link {
            color: #94a3b8;
            padding: 12px 20px;
            margin: 4px 12px;
            border-radius: 8px;
            font-weight: 500;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #ffffff;
            background-color: #0284c7;
        }
        .main-content {
            flex: 1;
            padding: 30px;
        }
        .card-custom {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .form-control, .form-select {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 10px 14px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            border-color: #0284c7;
            color: #f8fafc;
            box-shadow: 0 0 0 0.25rem rgba(2, 132, 199, 0.25);
        }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- القائمة الجانبية -->
        <div class="sidebar p-3 d-flex flex-column">
            <div class="d-flex align-items-center gap-2 mb-4 px-2">
                <i class="fa-solid fa-wifi text-info fs-3"></i>
                <h4 class="m-0 fw-bold text-light">زينار <span class="fs-6 text-info">RADIUS</span></h4>
            </div>
            <hr class="border-secondary mb-3">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="/dashboard" class="nav-link"><i class="fa-solid fa-chart-pie ms-2"></i> لوحة التحكم</a>
                </li>
                <li>
                    <a href="/subscribers" class="nav-link"><i class="fa-solid fa-users ms-2"></i> المشتركون</a>
                </li>
                <li>
                    <a href="/add_subscriber" class="nav-link"><i class="fa-solid fa-user-plus ms-2"></i> إضافة مشترك</a>
                </li>
                <li>
                    <a href="/routers" class="nav-link"><i class="fa-solid fa-server ms-2"></i> الراوترات</a>
                </li>
            </ul>
        </div>

        <!-- المحتوى الرئيسي -->
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
