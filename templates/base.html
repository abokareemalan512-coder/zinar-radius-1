<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} - زينار RADIUS</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #0b1329 !important;
            color: #ffffff !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar {
            width: 270px;
            background-color: #1e293b !important;
            min-height: 100vh;
            border-left: 1px solid #334155;
        }
        .sidebar .nav-link {
            color: #e2e8f0 !important;
            padding: 12px 18px;
            margin: 4px 10px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #ffffff !important;
            background-color: #0284c7 !important;
        }
        .main-content {
            flex: 1;
            padding: 28px;
        }
        .card-custom {
            background-color: #1e293b !important;
            border: 1px solid #334155 !important;
            border-radius: 12px;
            color: #ffffff !important;
        }
        .text-muted {
            color: #cbd5e1 !important;
        }
        h1, h2, h3, h4, h5, h6, label, p, span, div, td, th {
            color: #ffffff;
        }
        .form-control, .form-select {
            background-color: #0f172a !important;
            border: 1px solid #475569 !important;
            color: #ffffff !important;
            padding: 10px 14px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0f172a !important;
            border-color: #38bdf8 !important;
            color: #ffffff !important;
        }
        .form-control::placeholder {
            color: #94a3b8 !important;
        }
        .table {
            color: #ffffff !important;
        }
        .table th {
            color: #38bdf8 !important;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- القائمة الجانبية -->
        <div class="sidebar p-3 d-flex flex-column">
            <div class="d-flex align-items-center gap-2 mb-4 px-2">
                <i class="fa-solid fa-wifi text-info fs-3"></i>
                <h4 class="m-0 fw-bold text-white">زينار <span class="fs-6 text-info">RADIUS</span></h4>
            </div>
            <hr class="border-secondary mb-3">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="/dashboard" class="nav-link"><i class="fa-solid fa-gauge-high ms-2 text-info"></i> لوحة التحكم</a>
                </li>
                <li>
                    <a href="/subscribers" class="nav-link"><i class="fa-solid fa-users ms-2 text-info"></i> المشتركون والكروت</a>
                </li>
                <li>
                    <a href="/add_subscriber" class="nav-link"><i class="fa-solid fa-user-plus ms-2 text-info"></i> إضافة / توليد حسابات</a>
                </li>
                <li>
                    <a href="/routers" class="nav-link"><i class="fa-solid fa-server ms-2 text-info"></i> سيرفرات الميكروتيك</a>
                </li>
                <li class="mt-2 border-top border-secondary pt-2">
                    <a href="/admin_settings" class="nav-link"><i class="fa-solid fa-user-gear ms-2 text-warning"></i> إعدادات حساب المسؤول</a>
                </li>
            </ul>
            <hr class="border-secondary my-3">
            <div class="px-2">
                <a href="/login" class="btn btn-outline-danger w-100 btn-sm fw-bold"><i class="fa-solid fa-right-from-bracket me-1"></i> تسجيل الخروج</a>
            </div>
        </div>

        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
