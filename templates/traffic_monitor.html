{% extends "base.html" %}
{% block title %}مراقبة حركة المرور{% endblock %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body { font-family: 'Tajawal', sans-serif; }

    .port-card {
        background-color: var(--bg-card);
        border: 1px solid var(--bg-hover);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .port-card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 6px 15px -5px rgba(56, 189, 248, 0.2);
    }
    .port-card.selected {
        border-color: var(--accent);
        background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(14, 165, 233, 0.02));
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }
    .port-card.disabled {
        opacity: 0.45;
    }
    .port-card.disabled .port-name {
        color: #94a3b8;
    }
    .port-card .port-name {
        font-family: monospace;
        font-weight: 700;
        font-size: 0.8rem;
        color: var(--text-main);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 5px;
    }
    .port-card .port-status {
        display: inline-flex;
        align-items: center;
        font-size: 0.6rem;
        padding: 1px 5px;
        border-radius: 8px;
    }
    .port-card .port-status.running {
        background: rgba(34, 197, 94, 0.15);
        color: #22c55e;
    }
    .port-card .port-status.idle {
        background: rgba(148, 163, 184, 0.15);
        color: #94a3b8;
    }
    .port-card .port-status.disabled {
        background: rgba(239, 68, 68, 0.15);
        color: #ef4444;
    }
    .port-card .port-speeds {
        display: flex;
        justify-content: space-between;
        gap: 4px;
        font-size: 0.68rem;
        font-weight: 600;
    }
    .port-card .speed-down { color: #22c55e; font-family: monospace; }
    .port-card .speed-up { color: #f59e0b; font-family: monospace; }

    .router-section {
        background-color: var(--bg-card);
        border: 1px solid var(--bg-hover);
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 14px;
    }
    .router-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--bg-hover);
    }
    .router-name {
        font-weight: 700;
        color: var(--accent);
        font-size: 0.9rem;
    }
    .router-ip {
        font-family: monospace;
        font-size: 0.7rem;
        color: var(--text-muted);
    }

    .traffic-card {
        background-color: var(--bg-card);
        border: 1px solid var(--bg-hover);
        border-radius: 12px;
        padding: 14px;
    }
    .traffic-value { font-size: 1.8rem; font-weight: 800; margin: 4px 0; }
    .traffic-unit { font-size: 0.85rem; font-weight: 500; opacity: 0.8; }
    .traffic-progress {
        height: 6px;
        background-color: var(--bg-main);
        border-radius: 3px;
        overflow: hidden;
        margin: 8px 0;
    }
    .traffic-progress-bar { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
    .chart-container { position: relative; height: 130px; width: 100%; }
    .upload-color { color: #f59e0b; }
    .download-color { color: #22c55e; }
    .bg-upload { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .bg-download { background: linear-gradient(90deg, #22c55e, #4ade80); }

    .control-select {
        background-color: var(--bg-card);
        color: var(--text-main);
        border: 1px solid var(--bg-hover);
        padding: 7px 10px;
        border-radius: 8px;
        font-weight: 500;
        font-size: 0.8rem;
    }
    .control-select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 0.15rem var(--accent-glow);
        outline: none;
    }

    .status-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background-color: #22c55e;
        animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
        70% { box-shadow: 0 0 0 6px transparent; opacity: 0.7; }
        100% { box-shadow: 0 0 0 0 transparent; opacity: 1; }
    }

    .badge-small {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 10px;
        border-radius: 10px;
        font-size: 0.7rem;
        font-weight: 700;
    }

    .controls-bar {
        background-color: var(--bg-card);
        border: 1px solid var(--bg-hover);
        border-radius: 10px;
        padding: 10px 14px;
        margin-bottom: 12px;
    }
</style>

<!-- العنوان والتحكم -->
<div class="controls-bar d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div class="d-flex align-items-center gap-2">
        <i class="bi bi-graph-up-arrow text-accent fs-5"></i>
        <strong>مراقبة الترافيك - 26 منفذ</strong>
        <span class="badge-small" style="background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: #0f172a;">
            <i class="bi bi-lightning-charge-fill"></i> API
        </span>
    </div>

    <div class="d-flex gap-2 flex-wrap align-items-center">
        <button id="refreshBtn" class="btn btn-sm btn-primary" onclick="refreshAll()">
            <i class="bi bi-arrow-clockwise"></i> تحديث
        </button>

        <button id="toggleBtn" class="btn btn-sm btn-success" onclick="toggleLive()">
            <i class="bi bi-play-fill"></i> Live
        </button>

        <span id="liveStatus" class="badge-small" style="display:none; background: rgba(34, 197, 94, 0.15); color:#22c55e; border: 1px solid rgba(34, 197, 94, 0.3);">
            <span class="status-dot"></span> مباشر
        </span>
    </div>
</div>

<!-- عرض 2 راوتر - كل واحد 13 منفذ -->
<div id="routersContainer">
    <!-- يُملأ بالجافاسكربت -->
</div>

<!-- منطقة التفاصيل للرسم البياني -->
<div id="detailArea" class="row g-3" style="display: none;">
    <div class="col-md-6">
        <div class="traffic-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="fw-bold mb-0 download-color">
                    <i class="bi bi-arrow-down-circle-fill"></i> تحميل
                    <small class="text-muted" id="selectedPortNameDown" style="font-size:0.7rem;"></small>
                </h6>
                <span class="badge-small" id="downloadRateBadge" style="background: rgba(34,197,94,0.1); color:#22c55e; border:1px solid rgba(34,197,94,0.3);">0 Mbps</span>
            </div>
            <div class="text-center">
                <div class="traffic-value download-color">
                    <span id="downloadRate">0.00</span> <span class="traffic-unit">Mbps</span>
                </div>
            </div>
            <div class="traffic-progress">
                <div class="traffic-progress-bar bg-download" id="downloadProgress" style="width: 0%;"></div>
            </div>
            <div class="d-flex justify-content-between text-muted" style="font-size:0.75rem;">
                <span><i class="bi bi-hdd-stack"></i> إجمالي:</span>
                <span id="downloadTotal" class="fw-bold">0 GB</span>
            </div>
            <div class="chart-container"><canvas id="downloadChart"></canvas></div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="traffic-card">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h6 class="fw-bold mb-0 upload-color">
                    <i class="bi bi-arrow-up-circle-fill"></i> رفع
                    <small class="text-muted" id="selectedPortNameUp" style="font-size:0.7rem;"></small>
                </h6>
                <span class="badge-small" id="uploadRateBadge" style="background: rgba(245,158,11,0.1); color:#f59e0b; border:1px solid rgba(245,158,11,0.3);">0 Mbps</span>
            </div>
            <div class="text-center">
                <div class="traffic-value upload-color">
                    <span id="uploadRate">0.00</span> <span class="traffic-unit">Mbps</span>
                </div>
            </div>
            <div class="traffic-progress">
                <div class="traffic-progress-bar bg-upload" id="uploadProgress" style="width: 0%;"></div>
            </div>
            <div class="d-flex justify-content-between text-muted" style="font-size:0.75rem;">
                <span><i class="bi bi-hdd-stack"></i> إجمالي:</span>
                <span id="uploadTotal" class="fw-bold">0 GB</span>
            </div>
            <div class="chart-container"><canvas id="uploadChart"></canvas></div>
        </div>
    </div>
</div>

<script>
    const MAX_POINTS = 30;
    const INTERVAL = 3000;

    // قائمة الراوترات من السيرفر
    const ROUTERS = [
        {% for r in routers %}
        { id: {{ r.id }}, name: "{{ r.name }}", ip: "{{ r.ip_address }}", port: {{ r.api_port or 8728 }} },
        {% endfor %}
    ];

    // حالة كل راوتر: { routerId: { ports: [...], selectedPort: null } }
    const state = {};
    const directionMap = {};   // key = "routerId_portName"

    let liveTimer = null;
    let isLive = false;

    let uploadChart = null;
    let downloadChart = null;
    let uploadData = [];
    let downloadData = [];
    let labels = [];

    function fmtSpeedToMbps(s) {
        if (!s) return 0;
        s = String(s);
        if (s.includes('Gbps')) return parseFloat(s) * 1000;
        if (s.includes('Mbps')) return parseFloat(s);
        if (s.includes('kbps')) return parseFloat(s) / 1000;
        const n = parseFloat(s);
        return isNaN(n) ? 0 : n / 1000000;
    }
    function bytesToGB(b) {
        return ((Number(b) || 0) / (1024 * 1024 * 1024)).toFixed(2);
    }
    function dirKey(rid, name) { return rid + '_' + name; }
    function getDirection(rid, name) {
        const k = dirKey(rid, name);
        if (!directionMap[k]) directionMap[k] = 'wan';
        return directionMap[k];
    }
    function togglePortDirection(rid, name, event) {
        if (event) event.stopPropagation();
        const k = dirKey(rid, name);
        directionMap[k] = (directionMap[k] === 'lan') ? 'wan' : 'lan';
        renderAll();
        if (state[rid] && state[rid].selectedPort === name) updateDetail(rid, name);
    }

    // ═══════════════════════════════════════════
    //      بناء الواجهة
    // ═══════════════════════════════════════════
    function buildUI() {
        const container = document.getElementById('routersContainer');
        container.innerHTML = ROUTERS.map(r => `
            <div class="router-section" id="router-${r.id}">
                <div class="router-header">
                    <div>
                        <span class="router-name">🖥️ ${r.name}</span>
                        <span class="router-ip ms-2">${r.ip}:${r.port}</span>
                    </div>
                    <span class="badge-small" id="status-${r.id}" style="background: rgba(148,163,184,0.15); color:#94a3b8;">⏳ جاري</span>
                </div>
                <div class="row g-2" id="ports-${r.id}">
                    <div class="col-12 text-center text-muted small py-3">جاري جلب المنافذ...</div>
                </div>
            </div>
        `).join('');
    }

    // ═══════════════════════════════════════════
    //      جلب منافذ كل راوتر
    // ═══════════════════════════════════════════
    function loadRouterPorts(router) {
        return fetch(`/api/traffic/interfaces/${router.id}`)
            .then(r => r.json())
            .then(data => {
                if (!data.ok) throw new Error(data.error || 'فشل');
                const ports = (data.interfaces || []).filter(p => {
                    const m = p.name.match(/^ether(\d+)$/);
                    return m && parseInt(m[1]) >= 1 && parseInt(m[1]) <= 13;
                }).sort((a, b) => {
                    return parseInt(a.name.replace('ether','')) - parseInt(b.name.replace('ether',''));
                });

                // نضمن وجود ether1..ether13 (حتى لو معطّلة)
                const full = [];
                for (let i = 1; i <= 13; i++) {
                    const nm = 'ether' + i;
                    const found = ports.find(p => p.name === nm);
                    if (found) full.push(found);
                    else full.push({ name: nm, running: false, disabled: true, type: 'ether' });
                }

                state[router.id] = { ports: full, selectedPort: null };
                return full;
            })
            .catch(err => {
                console.error('❌', router.name, err);
                return [];
            });
    }

    function renderAll() {
        ROUTERS.forEach(r => {
            renderRouterPorts(r.id);
        });
    }

    function renderRouterPorts(rid) {
        const container = document.getElementById('ports-' + rid);
        if (!container) return;
        const st = state[rid];
        if (!st) return;

        container.innerHTML = st.ports.map(p => {
            const isSelected = st.selectedPort === p.name ? 'selected' : '';
            const isDisabled = p.disabled || (!p.running && !p.rx_rate && !p.tx_rate && p.disabled);
            const disClass = isDisabled ? 'disabled' : '';
            let statusCls = 'idle', statusTxt = '⚪';
            if (p.disabled) { statusCls = 'disabled'; statusTxt = '⛔'; }
            else if (p.running) { statusCls = 'running'; statusTxt = '🟢'; }

            const dir = getDirection(rid, p.name);
            let rxV = fmtSpeedToMbps(p.rx_rate).toFixed(1);
            let txV = fmtSpeedToMbps(p.tx_rate).toFixed(1);
            let downV, upV;
            if (dir === 'wan') { downV = rxV; upV = txV; }
            else { downV = txV; upV = rxV; }

            return `
                <div class="col-xl-2 col-lg-3 col-md-4 col-6">
                    <div class="port-card ${isSelected} ${disClass}" onclick="selectPort(${rid}, '${p.name}')">
                        <div class="port-name">
                            <span>${p.name}</span>
                            <span class="port-status ${statusCls}">${statusTxt}</span>
                        </div>
                        <div class="port-speeds">
                            <span class="speed-down">⬇ ${downV}</span>
                            <span class="speed-up">⬆ ${upV}</span>
                        </div>
                        <div class="text-center mt-1">
                            <button class="btn btn-sm p-0 border-0 text-muted" style="font-size:0.6rem;"
                                    onclick="togglePortDirection(${rid}, '${p.name}', event)"
                                    title="تبديل الاتجاه (${dir.toUpperCase()})">
                                <i class="bi bi-arrow-left-right"></i> ${dir.toUpperCase()}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ═══════════════════════════════════════════
    //      جلب السرعات لكل الراوترات
    // ═══════════════════════════════════════════
    function fetchAllStats() {
        ROUTERS.forEach(r => {
            const st = state[r.id];
            if (!st) return;
            const promises = st.ports.map(p =>
                fetch(`/api/traffic/stats/${r.id}/${p.name}`)
                    .then(res => res.json())
                    .then(d => d.ok ? { name: p.name, ...d.stats } : null)
                    .catch(() => null)
            );
            Promise.all(promises).then(results => {
                results.forEach(res => {
                    if (!res) return;
                    const port = st.ports.find(p => p.name === res.name);
                    if (port) {
                        port.rx_rate = res.rx_rate;
                        port.tx_rate = res.tx_rate;
                        port.rx_byte = res.rx_byte;
                        port.tx_byte = res.tx_byte;
                    }
                });
                renderRouterPorts(r.id);
                if (st.selectedPort) {
                    const p = st.ports.find(x => x.name === st.selectedPort);
                    if (p) updateDetail(r.id, p.name);
                }
            });
        });
    }

    // ═══════════════════════════════════════════
    //      اختيار منفذ
    // ═══════════════════════════════════════════
    function selectPort(rid, name) {
        Object.keys(state).forEach(k => {
            if (state[k]) state[k].selectedPort = null;
        });
        state[rid].selectedPort = name;
        renderAll();
        document.getElementById('detailArea').style.display = 'flex';

        // مسح المخططات
        uploadData.length = 0; downloadData.length = 0; labels.length = 0;
        if (uploadChart) { uploadChart.data.labels = labels; uploadChart.data.datasets[0].data = uploadData; uploadChart.update(); }
        if (downloadChart) { downloadChart.data.labels = labels; downloadChart.data.datasets[0].data = downloadData; downloadChart.update(); }

        document.getElementById('selectedPortNameDown').textContent = '- ' + name + ' (R' + rid + ')';
        document.getElementById('selectedPortNameUp').textContent = '- ' + name + ' (R' + rid + ')';

        const p = state[rid].ports.find(x => x.name === name);
        if (p) updateDetail(rid, p.name);
    }

    function updateDetail(rid, name) {
        const st = state[rid];
        if (!st) return;
        const p = st.ports.find(x => x.name === name);
        if (!p) return;

        const dir = getDirection(rid, name);
        let rxV = fmtSpeedToMbps(p.rx_rate);
        let txV = fmtSpeedToMbps(p.tx_rate);
        let rxB = parseInt(p.rx_byte || 0);
        let txB = parseInt(p.tx_byte || 0);

        let downV, upV, downB, upB;
        if (dir === 'wan') { downV = rxV; upV = txV; downB = rxB; upB = txB; }
        else { downV = txV; upV = rxV; downB = txB; upB = rxB; }

        document.getElementById('downloadRate').textContent = downV.toFixed(2);
        document.getElementById('uploadRate').textContent = upV.toFixed(2);
        document.getElementById('downloadTotal').textContent = bytesToGB(downB) + ' GB';
        document.getElementById('uploadTotal').textContent = bytesToGB(upB) + ' GB';
        document.getElementById('downloadRateBadge').textContent = downV.toFixed(2) + ' Mbps';
        document.getElementById('uploadRateBadge').textContent = upV.toFixed(2) + ' Mbps';
        document.getElementById('downloadProgress').style.width = Math.min((downV / 100) * 100, 100) + '%';
        document.getElementById('uploadProgress').style.width = Math.min((upV / 100) * 100, 100) + '%';

        if (!uploadChart) initCharts();

        const now = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        labels.push(now);
        uploadData.push(upV);
        downloadData.push(downV);
        if (labels.length > MAX_POINTS) { labels.shift(); uploadData.shift(); downloadData.shift(); }
        uploadChart.update('none');
        downloadChart.update('none');
    }

    // ═══════════════════════════════════════════
    //      المخططات
    // ═══════════════════════════════════════════
    function initCharts() {
        const opts = {
            responsive: true, maintainAspectRatio: false,
            animation: { duration: 200 },
            plugins: { legend: { display: false } },
            scales: {
                x: { display: false },
                y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: { size: 9 } } }
            },
            elements: { point: { radius: 0 }, line: { tension: 0.4, borderWidth: 2 } }
        };
        uploadChart = new Chart(document.getElementById('uploadChart').getContext('2d'), {
            type: 'line',
            data: { labels, datasets: [{ data: uploadData, borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.15)', fill: true }] },
            options: opts
        });
        downloadChart = new Chart(document.getElementById('downloadChart').getContext('2d'), {
            type: 'line',
            data: { labels, datasets: [{ data: downloadData, borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.15)', fill: true }] },
            options: opts
        });
    }

    // ═══════════════════════════════════════════
    //      Live / Refresh
    // ═══════════════════════════════════════════
    function toggleLive() {
        isLive ? stopLive() : startLive();
    }
    function startLive() {
        isLive = true;
        document.getElementById('liveStatus').style.display = 'inline-flex';
        document.getElementById('toggleBtn').innerHTML = '<i class="bi bi-stop-fill"></i> إيقاف';
        document.getElementById('toggleBtn').classList.replace('btn-success', 'btn-danger');
        liveTimer = setInterval(fetchAllStats, INTERVAL);
    }
    function stopLive() {
        isLive = false;
        if (liveTimer) clearInterval(liveTimer);
        liveTimer = null;
        document.getElementById('liveStatus').style.display = 'none';
        document.getElementById('toggleBtn').innerHTML = '<i class="bi bi-play-fill"></i> Live';
        document.getElementById('toggleBtn').classList.replace('btn-danger', 'btn-success');
    }
    function refreshAll() { fetchAllStats(); }

    // ═══════════════════════════════════════════
    //      Init
    // ═══════════════════════════════════════════
    window.addEventListener('DOMContentLoaded', function() {
        buildUI();

        // حمّل منافذ كل الراوترات
        Promise.all(ROUTERS.map(r => loadRouterPorts(r))).then(() => {
            renderAll();

            // حدّث حالة كل راوتر
            ROUTERS.forEach(r => {
                const st = state[r.id];
                const el = document.getElementById('status-' + r.id);
                if (st && st.ports.length > 0) {
                    el.style.background = 'rgba(34,197,94,0.15)';
                    el.style.color = '#22c55e';
                    el.textContent = '✅ ' + st.ports.length + ' منفذ';
                } else {
                    el.style.background = 'rgba(239,68,68,0.15)';
                    el.style.color = '#ef4444';
                    el.textContent = '❌ فشل';
                }
            });

            fetchAllStats();
        });
    });
</script>
{% endblock %}
