<div class="col-xl-3 col-md-6">
    <div class="card shadow-sm border-0 h-100" style="background: rgba(18, 35, 58, 0.9); border: 1px solid rgba(255,255,255,0.08);">
        <div class="card-body text-center py-4">
            <div class="d-flex justify-content-center align-items-center mb-3">
                <div class="rounded-circle d-flex align-items-center justify-content-center"
                     style="width: 56px; height: 56px; background: linear-gradient(135deg, #2a7ae2, #32a8ff);">
                    <i class="bi bi-telegram text-white" style="font-size: 1.8rem;"></i>
                </div>
            </div>

            <h6 class="text-white mb-2">تيلجرام</h6>

            {% if telegram_settings and telegram_settings.enabled %}
                <span class="badge bg-success px-3 py-2">✅ مفعل</span>
            {% else %}
                <span class="badge bg-danger px-3 py-2">❌ معطل</span>
            {% endif %}

            <div class="mt-3">
                <a href="{{ url_for('admin_settings') }}" class="btn btn-sm btn-primary w-100">
                    <i class="bi bi-gear"></i> إعدادات
                </a>
            </div>
        </div>
    </div>
</div>
