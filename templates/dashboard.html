{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="fa-solid fa-house text-primary"></i> لوحة التحكم</h1>
</div>

<div class="row">
    <div class="col-md-4 mb-3">
        <div class="card shadow-sm p-3 border-start border-primary border-4">
            <h5>الراوترات المضافة</h5>
            <h3>{{ routers_count }}</h3>
        </div>
    </div>
    <div class="col-md-4 mb-3">
        <div class="card shadow-sm p-3 border-start border-success border-4">
            <h5>إجمالي المستخدمين</h5>
            <h3>{{ sub_count }}</h3>
        </div>
    </div>
    <div class="col-md-4 mb-3">
        <div class="card shadow-sm p-3 border-start border-warning border-4">
            <h5>المشتركون النشطون</h5>
            <h3>{{ active_subs }}</h3>
        </div>
    </div>
</div>
{% endblock %}
