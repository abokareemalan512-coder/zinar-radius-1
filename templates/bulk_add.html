{% extends "base.html" %}
{% block title %}إضافة جماعية{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>👥 إضافة جماعية للمستخدمين</h2>
    <a href="{{ url_for('add_subscriber') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-right"></i> رجوع
    </a>
</div>

<div class="row g-4">
    <div class="col-lg-8">
        <div class="card p-4">
            <form method="POST" id="bulkForm">

                <div class="mb-3">
                    <label class="form-label">نوع المستخدم *</label>
                    <div class="d-flex gap-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio"
                                   name="user_type" value="pppoe" checked id="bt_pppoe">
                            <label class="form-check-label fw-bold" for="bt_pppoe">
                                🌐 برودباند (PPPoE)
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio"
                                   name="user_type" value="hotspot" id="bt_hotspot">
                            <label class="form-check-label fw-bold" for="bt_hotspot">
                                📶 هوت سبوت
                            </label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        <i class="bi bi-shuffle text-accent"></i> نوع الأسماء *
                    </label>
                    <div class="d-flex gap-4 flex-wrap">
                        <div class="form-check">
                            <input class="form-check-input" type="radio"
                                   name="char_mode" value="numbers" checked id="cm_numbers">
                            <label class="form-check-label fw-bold" for="cm_numbers">
                                🔢 أرقام
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio"
                                   name="char_mode" value="mixed" id="cm_mixed">
                            <label class="form-check-label fw-bold" for="cm_mixed">
                                🔤 أحرف وأرقام
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio"
                                   name="char_mode" value="letters" id="cm_letters">
                            <label class="form-check-label fw-bold" for="cm_letters">
                                🔡 أحرف
                            </label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">بادئة الأسماء (Prefix) — اختياري</label>
                    <input type="text" name="prefix" class="form-control"
                           placeholder="مثال: user_ أو P">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">طول الاسم *</label>
                        <input type="number" name="random_length" id="random_length"
                               class="form-control" value="6" min="4" max="20">
                        <small class="text-muted">مثال: 6 → <code>a3b7k9</code></small>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">العدد الكلي *</label>
                        <input type="number" name="count" class="form-control"
                               value="10" min="1" max="500">
                    </div>
                </div>

                <div class="alert alert-info small">
                    <strong>📋 معاينة (3 عينات):</strong>
                    <div id="previewText" class="mt-2" style="font-family: monospace; font-size: 14px; font-weight: 600;"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">طريقة كلمة المرور *</label>
                    <div class="d-flex gap-3 flex-wrap">
                        <div class="form-check">
                            <input class="form-check-input" type="radio"
                                   name="password_mode" value="random"
                                   id="pm_random" checked>
                            <label class="form-check-label fw-bold" for="pm_random">
                                🎲 كلمة مرور عشوائية
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio"
                                   name="password_mode" value="same_as_username"
                                   id="pm_same">
                            <label class="form-check-label" for="pm_same">
                                نفس اسم المستخدم
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio"
                                   name="password_mode" value="fixed" id="pm_fixed">
                            <label class="form-check-label" for="pm_fixed">
                                ثابتة للجميع
                            </label>
                        </div>
                    </div>
                </div>

                <div class="mb-3" id="random_pass_div">
                    <label class="form-label">طول كلمة المرور</label>
                    <input type="number" name="password_length" id="password_length"
                           class="form-control" value="6" min="4" max="20">
                </div>

                <div class="mb-3" id="fixed_password_div" style="display: none;">
                    <label class="form-label">كلمة المرور الثابتة</label>
                    <input type="text" name="fixed_password" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">الباقة *</label>
                    <select name="package" class="form-select" required>
                        <option value="">— اختر باقة —</option>
                        {% for pkg in packages %}
                        <option value="{{ pkg.name }}">
                            {{ pkg.name }} — {{ pkg.duration }}
                            {% if pkg.duration_unit == 'months' %}شهر{% else %}يوم{% endif %}
                            — {{ pkg.price }} ل.س
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">الراوتر *</label>
                    <select name="router_id" class="form-select" required>
                        <option value="">— اختر راوتر —</option>
                        {% for r in routers %}
                        <option value="{{ r.id }}">{{ r.name }} — {{ r.ip_address }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-check mb-4">
                    <input type="checkbox" name="push_to_router"
                           class="form-check-input" id="push_r" checked>
                    <label class="form-check-label fw-bold" for="push_r">
                        <i class="bi bi-cloud-upload"></i> رفع تلقائي إلى الراوتر
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold"
                        onclick="return confirm('إنشاء المستخدمين؟')">
                    <i class="bi bi-magic"></i> إنشاء المستخدمين
                </button>
            </form>
        </div>
    </div>

    <div class="col-lg-4">
        <div class="card p-4">
            <h5 class="text-accent mb-3">📊 الإحصائيات</h5>
            <ul class="list-unstyled mb-0" style="line-height: 2;">
                <li>🔢 <strong>الحد الأقصى:</strong> 500 مستخدم</li>
                <li>⚡ <strong>السرعة:</strong> ~1 مستخدم/ثانية</li>
                <li>💾 <strong>الحفظ:</strong> تلقائي</li>
                <li>📡 <strong>الراوتر:</strong> إنشاء تلقائي</li>
            </ul>
        </div>
    </div>
</div>

<script>
function randomString(len, mode) {
    const letters = 'abcdefghijkmnpqrstuvwxyz';
    const numbers = '23456789';
    let chars = '';
    if (mode === 'letters') chars = letters;
    else if (mode === 'mixed') chars = letters + numbers;
    else if (mode === 'numbers') chars = numbers;
    let out = '';
    for (let i = 0; i < len; i++) {
        out += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return out;
}

function updatePreview() {
    const mode = document.querySelector('input[name="char_mode"]:checked').value;
    const prefix = document.querySelector('input[name="prefix"]').value || '';
    const len = parseInt(document.getElementById('random_length').value) || 6;
    const samples = [];
    for (let i = 0; i < 3; i++) {
        samples.push(prefix + randomString(len, mode));
    }
    document.getElementById('previewText').textContent = samples.join('  |  ');
}

document.querySelectorAll('input[name="char_mode"]').forEach(el => {
    el.addEventListener('change', updatePreview);
});
document.querySelectorAll('input[name="prefix"], input[name="random_length"]').forEach(el => {
    el.addEventListener('input', updatePreview);
});

document.querySelectorAll('input[name="password_mode"]').forEach(el => {
    el.addEventListener('change', () => {
        const mode = document.querySelector('input[name="password_mode"]:checked').value;
        document.getElementById('random_pass_div').style.display =
            (mode === 'random') ? 'block' : 'none';
        document.getElementById('fixed_password_div').style.display =
            (mode === 'fixed') ? 'block' : 'none';
    });
});

updatePreview();
</script>
{% endblock %}
