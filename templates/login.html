<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - زينار RADIUS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 12px;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: #0284c7;
            color: #f8fafc;
            box-shadow: 0 0 0 0.25rem rgba(2, 132, 199, 0.25);
        }
    </style>
</head>
<body>
    <div class="login-card p-4">
        <div class="text-center mb-4">
            <div class="mb-2">
                <i class="fa-solid fa-wifi text-info display-4"></i>
            </div>
            <h3 class="fw-bold text-light m-0">زينار <span class="text-info fs-5">RADIUS</span></h3>
            <p class="text-muted small">تسجيل الدخول إلى لوحة إدارة الشبكة</p>
        </div>

        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label small text-light"><i class="fa-solid fa-user text-info me-1"></i> اسم المستخدم</label>
                <input type="text" name="username" class="form-control" placeholder="أدخل اسم المستخدم" required>
            </div>

            <div class="mb-4">
                <label class="form-label small text-light"><i class="fa-solid fa-lock text-info me-1"></i> كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="أدخل كلمة المرور" required>
            </div>

            <button type="submit" class="btn btn-info w-100 py-2 text-dark fw-bold">
                <i class="fa-solid fa-right-to-bracket me-1"></i> دخول إلى النظام
            </button>
        </form>
    </div>
</body>
</html>
