{% extends 'base.html' %}
{% block title %}تعديل مشترك{% endblock %}

{% block content %}
<div class="container-fluid" style="max-width: 800px;">
    <div class="card card-custom p-4">
        <div class="d-flex align-items-center gap-3 mb-4">
            <div class="bg-warning bg-opacity-10 p-3 rounded-3 text-warning">
                <i class="fa-solid fa-user-pen fs-3"></i>
            </div>
            <div>
                <h3 class="fw-bold mb-1">تعديل بيانات المشترك</h3>
                <p class="text-muted m-0">تحديث حساب: <span class="text-info fw-bold">{{ subscriber.username }}</span></p>
            </div>
        </div>

        <form action="/edit_subscriber/{{ subscriber.id }}" method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label text-light fw-semibold"><i class="fa-solid fa-user text-info me-1"></i> اسم المستخدم</label>
                    <input type="text" name="username" class="form-control" value="{{ subscriber.username }}" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-light fw-semibold"><i class="fa-solid fa-key text-info me-1"></i> كلمة المرور</label>
                    <input type="text" name="password" class="form-control" value="{{ subscriber.password }}" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-light fw-semibold"><i class="fa-solid fa-box text-info me-1"></i> الباقة / البروفايل</label>
                    <input type="text" name="profile" class="form-control" value="{{ subscriber.profile }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label text-light fw-semibold"><i class="fa-solid fa-phone text-info me-1"></i> رقم الهاتف</label>
                    <input type="text" name="phone" class="form-control" value="{{ subscriber.phone or '' }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label text-light fw-semibold"><i class="fa-solid fa-calendar text-info me-1"></i> تاريخ الانتهاء</label>
                    <input type="date" name="expiry_date" class="form-control" value="{{ subscriber.expiry_date or '' }}">
                </div>

                <div class="col-md-6">
                    <label class="form-label text-light fw-semibold"><i class="fa-solid fa-toggle-on text-info me-1"></i> حالة الحساب</label>
                    <select name="status" class="form-select">
                        <option value="active" {% if subscriber.status == 'active' %}selected{% endif %}>نشط (Active)</option>
                        <option value="disabled" {% if subscriber.status == 'disabled' %}selected{% endif %}>معطل (Disabled)</option>
                    </select>
                </div>
            </div>

            <hr class="border-secondary my-4">

            <div class="d-flex justify-content-end gap-2">
                <a href="/subscribers" class="btn btn-outline-secondary px-4">إلغاء</a>
                <button type="submit" class="btn btn-warning text-dark fw-bold px-4"><i class="fa-solid fa-floppy-disk me-1"></i> حفظ التعديلات</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
