{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2"><i class="fa-solid fa-box text-primary"></i> الباقات المتاحة</h1>
</div>

<div class="row">
    {% if packages %}
        {% for pkg in packages %}
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm p-3">
                <h5 class="fw-bold">{{ pkg.name }}</h5>
                <p class="text-muted">{{ pkg.speed }} - {{ pkg.price }}</p>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <div class="col-12">
            <div class="alert alert-info text-center">
                لا توجد باقات مضافة حتى الآن.
            </div>
        </div>
    {% endif %}
</div>
{% endblock %}
