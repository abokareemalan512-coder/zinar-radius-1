{% extends 'base.html' %}
{% block title %}إعدادات حساب المسؤول{% endblock %}

{% block content %}
<div class="container-fluid" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold m-0 text-white"><i class="fa-solid fa-user-gear text-info me-2"></i> إعدادات حساب المنصة (Admin)</h3>
            <span class="text-muted fs-6">تعديل اسم المستخدم وكلمة المرور للدخول إلى منصة إدارة زينار</span>
        </div>
    </div>

    {% if message %}
    <div class="alert alert-success d-flex align-items-center mb-4" role="alert">
        <i class="fa-solid fa-circle-check fs-5 me-2"></i>
        <div>{{ message }}</div>
    </div>
    {% endif %}

    {% if error %}
    <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
        <i class="fa-solid fa-triangle-exclamation fs-5 me-2"></i>
        <div>{{ error }}</div>
    </div>
    {% endif %}

    <div class="card card-custom p-4">
        <form action="/admin_settings" method="POST">
            <div class="mb-4">
                <label class="form-label fw-bold"><i class="fa-solid fa-user text-info me-1"></i> اسم مستخدم الأدمن الحالي / الجديد</label>
                <input type="text" name="username" class="form-control fs-5" value="{{ admin.username }}" required placeholder="أدخل اسم المستخدم الجديد">
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold"><i class="fa-solid fa-key text-warning me-1"></i> كلمة المرور الجديدة للمنصة</label>
                <input type="password" name="password" class="form-control fs-5" value="{{ admin.password }}" required placeholder="أدخل كلمة المرور الجديدة">
            </div>

            <div class="d-flex gap-2 justify-content-end mt-4">
                <a href="/dashboard" class="btn btn-outline-secondary px-4"><i class="fa-solid fa-arrow-right me-1"></i> إلغاء ورجوع</a>
                <button type="submit" class="btn btn-info px-4 py-2 text-dark fw-bold">
                    <i class="fa-solid fa-floppy-disk me-1"></i> حفظ التغيرات
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
