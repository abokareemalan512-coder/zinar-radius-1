<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المشتركين</title>
<style>
body{background:#0f172a;color:white;font-family:sans-serif;padding:20px}
.card{background:#1e293b;border-radius:12px;padding:20px}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:10px;border-bottom:1px solid #334155;text-align:right;font-size:14px}
.btn{padding:6px 10px;border-radius:6px;text-decoration:none;font-size:13px;margin:2px;display:inline-block}
.btn-wa{background:#22c55e;color:white}
.btn-del{background:#ef4444;color:white}
.btn-add{background:#0ea5e9;color:white;padding:10px 16px;border-radius:8px;text-decoration:none}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between;align-items:center">
<h2>👥 المشتركين</h2>
<a href="/add-subscriber" class="btn-add">+ إضافة</a>
</div>
<div class="card">
<table>
<tr><th>المستخدم</th><th>الباقة</th><th>رقم واتساب</th><th>إجراء</th></tr>
{% for s in subscribers %}
<tr>
<td><b>{{ s['username'] }}</b><br><small style="color:#94a3b8">{{ s['password'] }}</small></td>
<td>{{ s['profile'] }}</td>
<td>{{ s['phone'] }}</td>
<td>
<a class="btn btn-wa" target="_blank" href="https://wa.me/{{ s['phone'] }}?text=مرحبا%20{{ s['username'] }}%20تم%20تفعيل%20باقتك%20{{ s['profile'] }}%20✅%0Aاليوزر:%20{{ s['username'] }}%0Aالباس:%20{{ s['password'] }}%0Aشكرا%20لشبكة%20زينار">📱 واتساب</a>
<a class="btn btn-del" href="/subscribers/delete/{{ s['id'] }}">حذف</a>
</td>
</tr>
{% else %}
<tr><td colspan="4" style="text-align:center;color:#64748b;padding:20px">لا يوجد مشتركين</td></tr>
{% endfor %}
</table>
</div>
<div style="text-align:center;margin-top:20px"><a href="/dashboard" style="color:#94a3b8">← رجوع</a></div>
</body>
</html>
