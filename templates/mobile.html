<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZINAR - خفيف</title>
<style>
  body{background:#0a0c1a; color:#fff; font-family:system-ui; margin:0; padding:0; padding-bottom:80px}
  .topbar{padding:18px; background:#141735; display:flex; justify-content:space-between; font-size:18px; font-weight:bold}
  .card{background:#151a35; border-radius:18px; margin:12px; padding:16px; border:1px solid #1f2750}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0}
  .stat{text-align:center; padding:20px 10px}
  .stat .value{font-size:32px; font-weight:800; margin:8px 0}
  .stat .label{color:#8a92c0; font-size:14px}
  .up{color:#ffaa00} .down{color:#00ff88}
  .link{text-decoration:none; color:#fff; display:block}
  .link:active{transform:scale(0.97)}
  select{width:100%; background:#0a0c1a; color:#fff; border:1px solid #2a3366; padding:12px; border-radius:12px; font-size:16px}
  .bottom-nav{position:fixed; bottom:0; left:0; right:0; background:#141735; display:flex; justify-content:space-around; padding:10px 0; border-top:1px solid #1f2750}
  .bottom-nav a{color:#6c769e; text-decoration:none; text-align:center; font-size:22px}
  .bottom-nav a.active{color:#00ff88}
  .bottom-nav small{display:block; font-size:11px; margin-top:2px}
  #status{font-size:13px}
</style>
</head>
<body>
<header class="topbar">
  <div>⚡ ZINAR</div>
  <div id="status" style="color:#00ff88">● متصل</div>
</header>

<main>
  <div class="card">
    <label style="color:#8a92c0; font-size:13px; display:block; margin-bottom:8px">اختر المنفذ</label>
    <select id="iface"><option>جاري التحميل...</option></select>
  </div>

  <div class="grid2">
    <div class="card stat">
      <div style="font-size:24px">↑</div>
      <div class="value up" id="up">0.0</div>
      <div class="label">رفع Mbps</div>
    </div>
    <div class="card stat">
      <div style="font-size:24px">↓</div>
      <div class="value down" id="down">0.0</div>
      <div class="label">تحميل Mbps</div>
    </div>
  </div>

  <div class="grid2">
    <a href="/subscribers" class="card stat link">
      <div style="font-size:28px">👥</div>
      <div class="value" id="sub_count">{{ sub_count }}</div>
      <div class="label">اضغط لعرض المشتركين</div>
    </a>
    <a href="/routers" class="card stat link">
      <div style="font-size:28px">📡</div>
      <div class="value" id="router_count">{{ router_count }}</div>
      <div class="label">النواشر - اضغط للفحص</div>
    </a>
  </div>

  <div class="card" style="text-align:center; color:#8a92c0; font-size:12px">
    آخر تحديث: <span id="time">--:--:--</span> | خفيف للعين والبطارية
  </div>
</main>

<nav class="bottom-nav">
  <a href="/mobile" class="active"><span>🏠</span><small>الرئيسية</small></a>
  <a href="/subscribers"><span>👥</span><small>المشتركين</small></a>
  <a href="/nawashir"><span>📡</span><small>النواشر</small></a>
  <a href="/logout"><span>🚪</span><small>خروج</small></a>
</nav>

<script>
let ifaceEl = document.getElementById('iface');
async function loadIfaces(){
  try{
    let r = await fetch('/api/ifaces'); let d = await r.json();
    let cur = ifaceEl.value;
    ifaceEl.innerHTML='';
    (d.ifaces||[]).forEach(n=>{
      let o=document.createElement('option'); o.value=n; o.textContent=n; ifaceEl.appendChild(o);
    });
    if(cur) ifaceEl.value=cur;
  }catch(e){}
}
async function updateTraffic(){
  let iface = ifaceEl.value; if(!iface) return;
  try{
    let r = await fetch(`/api/traffic?iface=${iface}`); let d = await r.json();
    document.getElementById('up').textContent = (d.up||0).toFixed(1);
    document.getElementById('down').textContent = (d.down||0).toFixed(1);
    document.getElementById('time').textContent = new Date().toLocaleTimeString('ar-SY');
    document.getElementById('status').textContent='● متصل';
    document.getElementById('status').style.color='#00ff88';
  }catch(e){
    document.getElementById('status').textContent='● غير متصل';
    document.getElementById('status').style.color='#ff4444';
  }
}
ifaceEl.addEventListener('change', updateTraffic);
loadIfaces();
setInterval(updateTraffic, 15000); // كل 15 ثانية بدل 10 مشان البطارية
setTimeout(updateTraffic, 1000);
</script>
</body>
</html>
