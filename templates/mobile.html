<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1225">
<link rel="manifest" href="/static/manifest.json">
<title>ZINAR</title>
<link rel="stylesheet" href="/static/mobile.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">⚡</span> ZINAR</div>
  <div class="status-dot" id="status">● متصل</div>
</header>

<main class="content">

  <section class="card">
    <div class="row">
      <label>اختر المنفذ</label>
      <select id="iface" onchange="update()">
        <option value="">جاري التحميل...</option>
      </select>
    </div>
  </section>

  <section class="grid2">
    <div class="card stat">
      <div class="icon up">↑</div>
      <div class="label">رفع</div>
      <div class="value" id="up">0.0</div>
      <div class="unit">Mbps</div>
    </div>
    <div class="card stat">
      <div class="icon down">↓</div>
      <div class="label">تحميل</div>
      <div class="value" id="down">0.0</div>
      <div class="unit">Mbps</div>
    </div>
  </section>

  <section class="card chart-card">
    <div class="card-head">📈 آخر 60 ثانية</div>
    <canvas id="chart" height="180"></canvas>
  </section>

  <section class="grid2">
    <a href="/subscribers" class="card stat link">
      <div class="icon-user">👥</div>
      <div class="value">{{ sub_count }}</div>
      <div class="label">المشتركين</div>
    </a>
    <a href="/routers" class="card stat link">
      <div class="icon-bolt">⚡</div>
      <div class="value">{{ router_count }}</div>
      <div class="label">الراوترات</div>
    </a>
  </section>
</main>

<nav class="bottom-nav">
  <a href="/mobile" class="active"><span>🏠</span><small>الرئيسية</small></a>
  <a href="/subscribers"><span>👥</span><small>المشتركين</small></a>
  <a href="/packages"><span>📦</span><small>الباقات</small></a>
  <a href="/payments"><span>💰</span><small>المدفوعات</small></a>
  <a href="/logout"><span>🚪</span><small>خروج</small></a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
const ctx = document.getElementById('chart').getContext('2d');
const chart = new Chart(ctx, {
  type:'line',
  data:{ labels:[], datasets:[
    {label:'تحميل', data:[], borderColor:'#00e07a', backgroundColor:'rgba(0,224,122,0.1)', fill:true, tension:0.4, pointRadius:0},
    {label:'رفع', data:[], borderColor:'#f5a623', backgroundColor:'rgba(245,166,35,0.1)', fill:true, tension:0.4, pointRadius:0}
  ]},
  options:{ responsive:true, maintainAspectRatio:false, animation:false,
    plugins:{legend:{labels:{color:'#fff', font:{size:11}}}},
    scales:{ x:{ticks:{color:'#888', maxTicksLimit:6, font:{size:9}}, grid:{color:'#1e2444'}},
             y:{ticks:{color:'#888', font:{size:10}}, grid:{color:'#1e2444'}, beginAtZero:true}}
  }
});

async function update(){
  const iface = document.getElementById('iface').value;
  try{
    const r = await fetch(`/api/traffic?iface=${iface}`);
    const d = await r.json();
    document.getElementById('up').textContent = (d.up||0).toFixed(1);
    document.getElementById('down').textContent = (d.down||0).toFixed(1);
    const t = new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    chart.data.labels.push(t);
    chart.data.datasets[0].data.push(d.down||0);
    chart.data.datasets[1].data.push(d.up||0);
    if(chart.data.labels.length > 30){
      chart.data.labels.shift();
      chart.data.datasets[0].data.shift();
      chart.data.datasets[1].data.shift();
    }
    chart.update('none');
    document.getElementById('status').textContent = '● متصل';
    document.getElementById('status').style.color = '#00e07a';
  }catch(e){
    document.getElementById('status').textContent = '● غير متصل';
    document.getElementById('status').style.color = '#e74c3c';
  }
}
async function loadIfaces(){
  try{
    const r = await fetch('/api/ifaces');
    const d = await r.json();
    const sel = document.getElementById('iface');
    const cur = sel.value;
    sel.innerHTML = '';
    (d.ifaces||[]).forEach(n => {
      const o = document.createElement('option');
      o.value = n; o.textContent = n;
      sel.appendChild(o);
    });
    if(cur && d.ifaces.includes(cur)) sel.value = cur;
  }catch(e){}
}
loadIfaces();
setTimeout(loadIfaces, 3000);

setInterval(update, 2000);
update();

if('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js');
</script>
</body>
</html>
