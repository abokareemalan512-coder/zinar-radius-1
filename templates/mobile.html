<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZINAR - مراقبة السرعة</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,'Segoe UI',sans-serif; }
body { background:#0d1117; color:#e6edf3; min-height:100vh; padding:20px; }
.header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.logo { display:flex; align-items:center; gap:10px; font-size:22px; font-weight:bold; color:#58a6ff; }
.logo-icon { width:40px; height:40px; background:linear-gradient(135deg,#1f6feb,#58a6ff); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:22px; }
.status { display:flex; align-items:center; gap:6px; font-size:12px; background:#161b22; padding:6px 12px; border-radius:20px; }
.dot { width:8px; height:8px; background:#3fb950; border-radius:50%; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.selector { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:16px; margin-bottom:20px; }
.selector label { display:block; font-size:13px; color:#8b949e; margin-bottom:8px; }
.selector select { width:100%; background:#0d1117; color:#e6edf3; border:1px solid #30363d; border-radius:8px; padding:12px; font-size:16px; }
.cards { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
.card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:16px; text-align:center; }
.card .icon { font-size:24px; margin-bottom:8px; }
.card .label { font-size:13px; color:#8b949e; margin-bottom:6px; }
.card .value { font-size:24px; font-weight:bold; }
.card .unit { font-size:14px; color:#8b949e; }
.download .value { color:#3fb950; }
.upload .value { color:#f0883e; }
.chart-box { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:16px; }
.chart-box h3 { font-size:14px; color:#8b949e; margin-bottom:12px; }
canvas { max-height:200px; }
</style>
</head>
<body>
<div class="header">
    <div class="logo">
        <div class="logo-icon">⚡</div>
        <span>ZINAR</span>
    </div>
    <div class="status">
        <div class="dot"></div>
        <span>متصل</span>
    </div>
</div>

<div class="selector">
    <label>اختر المنفذ</label>
    <select id="ifaceSelect"><option>جاري التحميل...</option></select>
</div>

<div class="cards">
    <div class="card download">
        <div class="icon">⬇️</div>
        <div class="label">تحميل</div>
        <div class="value" id="rxValue">0.0</div>
        <div class="unit">Mbps</div>
    </div>
    <div class="card upload">
        <div class="icon">⬆️</div>
        <div class="label">رفع</div>
        <div class="value" id="txValue">0.0</div>
        <div class="unit">Mbps</div>
    </div>
</div>

<div class="chart-box">
    <h3>📈 آخر 60 ثانية</h3>
    <canvas id="chart"></canvas>
</div>

<script>
const TOKEN = 'zinar-sync-token-2026';
const API = '/api/traffic/get';
const MAX_POINTS = 30;
let labels = [], rxData = [], txData = [];
let currentIface = null;
let chart;

function initChart() {
    const ctx = document.getElementById('chart');
    chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [
            { label:'تحميل', data:[], borderColor:'#3fb950', backgroundColor:'rgba(63,185,80,0.1)', tension:0.4, fill:true, pointRadius:0 },
            { label:'رفع', data:[], borderColor:'#f0883e', backgroundColor:'rgba(240,136,62,0.1)', tension:0.4, fill:true, pointRadius:0 }
        ]},
        options: {
            responsive:true, maintainAspectRatio:false,
            plugins:{ legend:{ labels:{ color:'#8b949e', font:{size:11} } } },
            scales: {
                x:{ ticks:{ color:'#8b949e', font:{size:10} }, grid:{ color:'#30363d' } },
                y:{ ticks:{ color:'#8b949e', font:{size:10} }, grid:{ color:'#30363d' }, beginAtZero:true }
            }
        }
    });
}

async function fetchData() {
    try {
        const r = await fetch(API, { headers:{'X-Sync-Token': TOKEN} });
        const d = await r.json();
        if (!d.interfaces) return;

        const sel = document.getElementById('ifaceSelect');
        if (sel.options.length !== d.interfaces.length) {
            sel.innerHTML = '';
            d.interfaces.forEach(i => {
                const o = document.createElement('option');
                o.value = i; o.textContent = i;
                sel.appendChild(o);
            });
            if (!currentIface) {
                currentIface = d.interfaces[0];
                sel.value = currentIface;
            }
        }

        const t = d.traffic[currentIface];
        if (t) {
            document.getElementById('rxValue').textContent = t.rx.toFixed(1);
            document.getElementById('txValue').textContent = t.tx.toFixed(1);

            const now = new Date().toLocaleTimeString('ar', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
            labels.push(now); rxData.push(t.rx); txData.push(t.tx);
            if (labels.length > MAX_POINTS) { labels.shift(); rxData.shift(); txData.shift(); }

            chart.data.labels = labels;
            chart.data.datasets[0].data = rxData;
            chart.data.datasets[1].data = txData;
            chart.update('none');
        }
    } catch(e) { console.error(e); }
}

document.getElementById('ifaceSelect').addEventListener('change', e => {
    currentIface = e.target.value;
    labels = []; rxData = []; txData = [];
});

initChart();
fetchData();
setInterval(fetchData, 3000);
</script>
</body>
</html>
